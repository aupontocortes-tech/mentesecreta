name: Veil Frequency - publicar Short

# Todo dia às 16h de Brasília (19:00 UTC) monta o próximo episódio da fila e AGENDA para 18h de Brasília (21:00 UTC).
# Botão manual (painel ou aba Actions): modo "agora" publica na hora.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'agora = publica na hora | agendar = agenda para 18h de Brasília'
        default: 'agora'

permissions:
  contents: write

concurrency:
  group: veil-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Pausa e fila
        id: fila
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && sed -n '/^## PAUSAS/,/^## /p' veil/CONFIG_CANAL.md | grep -qiE '^- *(18h|pausado)'; then
            echo "Pausado pelo painel."; echo "pular=1" >> $GITHUB_OUTPUT; exit 0
          fi
          prox=$(ls veil/historias/fila/*.json 2>/dev/null | sort | head -1)
          if [ -z "$prox" ]; then echo "::error::Fila do Veil Frequency vazia. Rode a tarefa semanal de histórias."; exit 1; fi
          if [ -z "${{ secrets.VF_YT_TOKEN_JSON || secrets.VFTOKEN }}" ]; then
            echo "::warning::Falta o Secret VF_YT_TOKEN_JSON (chave do YouTube do Veil Frequency). Nada publicado."
            echo "pular=1" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "ep=$prox" >> $GITHUB_OUTPUT; echo "Episódio: $prox"

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.pular != '1'
        with:
          python-version: '3.11'

      - name: Instalar
        if: steps.fila.outputs.pular != '1'
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q edge-tts numpy soundfile pillow google-auth-oauthlib google-api-python-client

      - name: Montar vídeo
        if: steps.fila.outputs.pular != '1'
        run: |
          python3 veil/historia.py "${{ steps.fila.outputs.ep }}" out
          ls -la out/final.mp4

      - name: Enviar para o YouTube
        if: steps.fila.outputs.pular != '1'
        env:
          YT_TOKEN_JSON: ${{ secrets.VF_YT_TOKEN_JSON || secrets.VFTOKEN }}
          VF_CHANNEL_ID: ${{ vars.VF_CHANNEL_ID }}
        run: |
          set -o pipefail
          E="${{ steps.fila.outputs.ep }}"
          MODO="${{ github.event.inputs.modo || 'agendar' }}"
          python3 veil/yt.py up out/final.mp4 "$E" "$MODO" | tee up.log
          ID=$(grep -o 'VIDEO_ID=[A-Za-z0-9_-]*' up.log | cut -d= -f2)
          python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['video_id']=sys.argv[2]; json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$E" "$ID"
          # versão dublada em português (não listada) para o Thiago conferir no painel; se falhar, o inglês segue normal
          if python3 veil/historia.py "$E" out pt && python3 veil/yt.py up out/pt/final.mp4 "$E" pt | tee up_pt.log; then
            IDPT=$(grep -o 'VIDEO_ID=[A-Za-z0-9_-]*' up_pt.log | cut -d= -f2)
            [ -n "$IDPT" ] && python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['video_id_pt']=sys.argv[2]; json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$E" "$IDPT"
          else
            echo "AVISO: versão em português falhou"
          fi
          mkdir -p veil/historias/publicados
          git add "$E"
          git mv -f "$E" veil/historias/publicados/
          git add -A veil/historias
          git config user.name "publicador-vf"
          git config user.email "actions@users.noreply.github.com"
          git commit -qm "Veil Frequency: publicado $(basename $E) ($ID)"
          git pull -q --rebase && git push -q
