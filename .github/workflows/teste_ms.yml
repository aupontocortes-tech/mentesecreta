name: Teste pinturas IA
on:
  push:
    paths: ['teste_ms.txt']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy
      - env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p amostras_ms
          python3 - <<'PY'
          import json, imagens
          d = json.load(open('roteiros/fila/13_ofensa.json'))
          for i in (0, 2, 7):
              print(i, imagens.da_ia(d['scenes'][i]['visual'], f'amostras_ms/{i}.jpg'))
          PY
          git config user.name teste && git config user.email actions@users.noreply.github.com
          git add amostras_ms && git commit -qm "amostras ms" && git pull -q --rebase && git push -q
