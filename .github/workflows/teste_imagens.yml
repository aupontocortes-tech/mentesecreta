name: Teste de estilo de imagem (não publica)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy
      - name: Gerar amostras
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p amostras
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, 'veil'); import historia
          sys.path.insert(0, '.'); import imagens
          v = [('veil1', f"{historia.ESTILO_INICIO}, a young man in a gray hoodie inside a small lit booth at an empty highway rest stop at night, looking scared at the restroom door, {historia.ESTILO}"),
               ('veil2', f"{historia.ESTILO_INICIO}, an old Mexican grandmother with a long gray braid sitting by candlelight in a farmhouse kitchen, looking worried at the window, {historia.ESTILO}")]
          for n, t in v: print(n, historia._cloudflare(t, 0, f'amostras/{n}.jpg'))
          for n, t in [('ms1', 'a coworker smiling and leaning over a desk asking a favor in a modern office'), ('ms2', 'a woman on a bus reading a message on her phone, worried')]:
              print(n, imagens.da_ia(t, f'amostras/{n}.jpg'))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: amostras, path: amostras }
