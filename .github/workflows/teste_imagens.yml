name: Teste de imagens (Cloudflare)
# Roda sozinho quando veil/teste_imagens.txt muda. Gera 3 imagens de exemplo e salva no ramo "teste-imagens" (não publica nada).
on:
  push:
    paths: ['veil/teste_imagens.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy
      - name: Gerar imagens
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "token: ${#CF_API_TOKEN} caracteres | conta: ${#CF_ACCOUNT_ID} caracteres"
          mkdir -p amostras
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'veil')
          import historia
          linhas = [l.strip() for l in open('veil/teste_imagens.txt') if l.strip()]
          for i, p in enumerate(linhas[:3]):
              r = historia._cloudflare(f'{p}, {historia.ESTILO}', 100 + i, f'amostras/img{i}.jpg')
              print('IMAGEM', i, 'OK' if r else 'FALHOU')
          PY
      - name: Salvar no ramo teste-imagens
        run: |
          ls amostras
          git config user.name "teste" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan teste-imagens && git rm -rqf --cached . && git add amostras && git commit -qm "amostras" && git push -qf origin teste-imagens
