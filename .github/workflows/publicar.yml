name: Publicar Shorts no YouTube

# Todo dia às 11h (Brasília) monta o próximo roteiro da fila e AGENDA para 12h.
# Botão manual (painel ou aba Actions): modo "agora" publica na hora.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'agora = publica na hora | agendar = agenda pro meio-dia'
        default: 'agora'

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pausa e fila
        id: fila
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && sed -n '/^## PAUSAS/,/^## /p' CONFIG_CANAL.md | grep -qiE '^- *(12h|pausado)'; then
            echo "Pausado pelo painel (12h)."; echo "pular=1" >> $GITHUB_OUTPUT; exit 0
          fi
          prox=$(ls roteiros/fila/*.json 2>/dev/null | sort | head -1)
          if [ -z "$prox" ]; then echo "::error::Fila de roteiros vazia. Rode a tarefa semanal de roteiros."; exit 1; fi
          echo "roteiro=$prox" >> $GITHUB_OUTPUT; echo "Roteiro: $prox"

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.pular != '1'
        with:
          python-version: '3.11'

      - name: Instalar
        if: steps.fila.outputs.pular != '1'
        run: |
          # ffmpeg pronto do PyPI (rápido); se falhar, usa o apt com novas tentativas
          pip install -q imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1 \
            || (sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg > /dev/null)
          pip install -q edge-tts numpy soundfile pillow google-auth-oauthlib google-api-python-client

      - name: Montar vídeo
        if: steps.fila.outputs.pular != '1'
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          R="${{ steps.fila.outputs.roteiro }}"
          python3 imagens.py "$R"
          python3 tts.py "$R" out
          python3 musica.py out
          python3 render.py "$R" out
          ls -la out/final.mp4

      - name: Enviar para o YouTube
        if: steps.fila.outputs.pular != '1'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          MS_CHANNEL_ID: ${{ vars.MS_CHANNEL_ID }}
        run: |
          set -o pipefail
          R="${{ steps.fila.outputs.roteiro }}"
          MODO="${{ github.event.inputs.modo || 'agendar' }}"
          python3 yt.py up out/final.mp4 "$R" "$MODO" | tee up.log
          ID=$(grep -o 'VIDEO_ID=[A-Za-z0-9_-]*' up.log | cut -d= -f2)
          python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['video_id']=sys.argv[2]; json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$R" "$ID"
          mkdir -p roteiros/publicados
          git mv "$R" roteiros/publicados/
          git add -A roteiros
          git config user.name "publicador-ms"
          git config user.email "actions@users.noreply.github.com"
          git commit -qm "Publicado $(basename $R) ($ID)"
          git pull -q --rebase && git push -q
